<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKNet Cashier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#020b08; --surface:#0a1a12; --surface2:#0f2318;
    --border:#1a4a2e; --accent:#00ff88; --accent2:#ff6b00;
    --gold:#ffd700; --cyan:#00d4ff; --red:#ff3355;
    --orange:#ff8800; --text:#e0fff0; --muted:#3a7a55;
    --glow:0 0 20px rgba(0,255,136,0.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-app-region:no-drag;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

  /* TITLE BAR */
  .titlebar{-webkit-app-region:drag;height:36px;background:linear-gradient(90deg,#020b08,#061a0e 50%,#020b08);border-bottom:1px solid #0f2318;display:flex;align-items:center;padding:0 16px;justify-content:space-between;flex-shrink:0;}
  .titlebar-title{font-family:'Orbitron',monospace;font-size:12px;color:var(--muted);letter-spacing:3px;}
  .titlebar-right{-webkit-app-region:no-drag;display:flex;gap:4px;}
  .tb-btn{width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:opacity 0.2s;}
  .tb-min{background:#ffd700;color:#000;} .tb-max{background:#00ff88;color:#000;} .tb-close{background:#ff3355;color:#fff;}
  .tb-btn:hover{opacity:0.8;}

  /* HEADER */
  .header{background:linear-gradient(90deg,#020b08,#061a0e 50%,#020b08);border-bottom:2px solid var(--accent);box-shadow:var(--glow);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:10;}
  .logo{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--accent);text-shadow:var(--glow);letter-spacing:3px;}
  .logo span{color:var(--accent2);}
  .server-info{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;letter-spacing:1px;}
  .server-ip{color:var(--cyan);font-family:'Orbitron',monospace;font-weight:700;}
  .server-label{color:var(--muted);font-size:11px;}
  .header-stats{display:flex;gap:16px;align-items:center;}
  .stat-item{text-align:center;}
  .stat-num{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;line-height:1;}
  .stat-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;}
  .stat-pending .stat-num{color:var(--orange);}
  .stat-processing .stat-num{color:var(--cyan);}
  .stat-done .stat-num{color:var(--accent);}
  .header-actions{display:flex;gap:8px;}
  .hdr-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:1px;}
  .hdr-btn:hover{border-color:var(--accent);color:var(--accent);}
  .hdr-btn.danger:hover{border-color:var(--red);color:var(--red);}
  .live-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite;box-shadow:0 0 8px var(--accent);}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.8);}}

  /* FILTER */
  .filter-bar{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;position:relative;z-index:5;}
  .f-btn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 16px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:all 0.2s;font-family:'Rajdhani',sans-serif;}
  .f-btn:hover{border-color:var(--accent);color:var(--accent);}
  .f-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,0.08);}
  .f-btn.f-pending{border-color:rgba(255,136,0,0.3);color:var(--orange);}
  .f-btn.f-pending.active{background:rgba(255,136,0,0.1);}
  .f-count{font-family:'Orbitron',monospace;font-size:11px;margin-left:4px;}

  /* ORDERS AREA */
  .orders-area{flex:1;overflow-y:auto;padding:16px 20px;position:relative;z-index:1;}
  .orders-area::-webkit-scrollbar{width:6px;}
  .orders-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}

  /* EMPTY */
  .empty{text-align:center;padding:80px 20px;color:var(--muted);}
  .empty .ei{font-size:60px;margin-bottom:16px;opacity:0.4;}
  .empty p{font-size:18px;letter-spacing:3px;}
  .empty small{font-size:13px;display:block;margin-top:8px;color:#1a4a2e;}

  /* ORDER CARD */
  .o-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all 0.3s;animation:slideIn 0.35s cubic-bezier(0.4,0,0.2,1);position:relative;}
  @keyframes slideIn{from{opacity:0;transform:translateY(16px) scale(0.97);}to{opacity:1;transform:none;}}
  .o-card.s-pending{border-color:var(--orange);box-shadow:0 0 18px rgba(255,136,0,0.12);}
  .o-card.s-processing{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,212,255,0.12);}
  .o-card.s-done{opacity:0.55;}
  .o-card.is-new::after{content:'MỚI!';position:absolute;top:0;right:0;background:var(--red);color:#fff;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;padding:3px 10px;border-radius:0 14px 0 10px;letter-spacing:2px;animation:blinkBadge 0.8s infinite;}
  @keyframes blinkBadge{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .c-head{padding:12px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);}
  .c-machine{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;color:var(--accent);text-shadow:0 0 10px rgba(0,255,136,0.3);}
  .c-time{font-size:11px;color:var(--muted);margin-top:2px;}
  .c-badge{padding:3px 10px;border-radius:14px;font-size:10px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
  .b-pending{background:rgba(255,136,0,0.12);color:var(--orange);border:1px solid var(--orange);}
  .b-processing{background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid var(--cyan);}
  .b-done{background:rgba(0,255,136,0.08);color:var(--accent);border:1px solid var(--border);}

  .c-body{padding:10px 14px;}
  .c-item{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px;}
  .c-item:last-child{border-bottom:none;}
  .ci-em{font-size:16px;width:22px;}
  .ci-n{flex:1;color:var(--text);}
  .ci-q{color:var(--cyan);font-family:'Orbitron',monospace;font-size:11px;font-weight:700;}
  .ci-p{color:var(--gold);font-family:'Orbitron',monospace;font-size:10px;}
  .c-note{margin-top:8px;padding:6px 8px;background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.15);border-radius:6px;font-size:11px;color:var(--gold);}

  .c-foot{padding:8px 14px 12px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);}
  .c-total{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--gold);}
  .c-acts{display:flex;gap:6px;}
  .a-btn{border:none;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all 0.2s;font-family:'Rajdhani',sans-serif;}
  .btn-recv{background:rgba(0,212,255,0.12);color:var(--cyan);border:1px solid var(--cyan);}
  .btn-recv:hover{background:rgba(0,212,255,0.25);}
  .btn-done2{background:rgba(0,255,136,0.12);color:var(--accent);border:1px solid var(--accent);}
  .btn-done2:hover{background:rgba(0,255,136,0.25);}
  .btn-del{background:rgba(255,51,85,0.08);color:var(--red);border:1px solid rgba(255,51,85,0.25);padding:6px 9px;}
  .btn-del:hover{background:rgba(255,51,85,0.2);}

  /* NOTIFICATION */
  .notif{position:fixed;top:60px;right:20px;width:310px;background:var(--surface);border:2px solid var(--red);border-radius:14px;padding:14px 18px;box-shadow:0 8px 40px rgba(255,51,85,0.4);z-index:999;display:none;animation:popIn 0.35s cubic-bezier(0.4,0,0.2,1);}
  .notif.show{display:block;}
  @keyframes popIn{from{opacity:0;transform:scale(0.85) translateY(-16px);}to{opacity:1;transform:none;}}
  .notif-title{font-family:'Orbitron',monospace;font-size:13px;color:var(--red);margin-bottom:6px;}
  .notif-body{font-size:13px;color:var(--text);line-height:1.5;}
  .notif-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}

  /* SOUND toggle */
  .sound-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:18px;cursor:pointer;transition:all 0.2s;}
  .sound-btn.on{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>

<!-- CUSTOM TITLEBAR -->
<div class="titlebar">
  <div class="titlebar-title">AKNET CASHIER v1.0</div>
  <div class="titlebar-right">
    <button class="tb-btn tb-min" onclick="window.aknet && window.electronWin.minimize()">─</button>
    <button class="tb-btn tb-max" onclick="window.electronWin && window.electronWin.maximize()">□</button>
    <button class="tb-btn tb-close" onclick="window.electronWin && window.electronWin.close()">✕</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="logo">AK<span>NET</span> <span style="font-size:13px;color:var(--muted);letter-spacing:2px;">CASHIER</span></div>
    <div class="server-info" style="margin-top:4px;">
      <div class="server-label">Địa chỉ IP cho máy trạm:</div>
      <div class="server-ip" id="serverAddr">Đang tải...</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat-item stat-pending"><div class="stat-num" id="sPending">0</div><div class="stat-lbl">CHỜ</div></div>
    <div style="width:1px;height:40px;background:var(--border);"></div>
    <div class="stat-item stat-processing"><div class="stat-num" id="sProcess">0</div><div class="stat-lbl">ĐANG LÀM</div></div>
    <div style="width:1px;height:40px;background:var(--border);"></div>
    <div class="stat-item stat-done"><div class="stat-num" id="sDone">0</div><div class="stat-lbl">XONG</div></div>
  </div>
  <div class="header-actions">
    <div class="live-dot"><div class="dot"></div>LIVE</div>
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()" title="Âm thanh">🔔</button>
    <button class="hdr-btn" onclick="clearDoneOrders()">Xóa đã xong</button>
    <button class="hdr-btn danger" onclick="confirmClearAll()">Xóa tất cả</button>
  </div>
</div>

<!-- FILTER -->
<div class="filter-bar">
  <button class="f-btn active" onclick="setFilter('all',this)">📋 Tất Cả <span class="f-count" id="fc-all"></span></button>
  <button class="f-btn f-pending" onclick="setFilter('pending',this)">🔴 Chờ Xử Lý <span class="f-count" id="fc-pending"></span></button>
  <button class="f-btn" onclick="setFilter('processing',this)">🔵 Đang Làm <span class="f-count" id="fc-processing"></span></button>
  <button class="f-btn" onclick="setFilter('done',this)">✅ Đã Xong <span class="f-count" id="fc-done"></span></button>
</div>

<!-- ORDERS -->
<div class="orders-area">
  <div class="orders-grid" id="ordersGrid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="ei">📡</div>
    <p>ĐANG CHỜ ĐƠN MỚI</p>
    <small>Máy trạm kết nối vào IP hiển thị bên trên</small>
  </div>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif">
  <button class="notif-close" onclick="closeNotif()">✕</button>
  <div class="notif-title">🔔 ORDER MỚI!</div>
  <div class="notif-body" id="notifBody"></div>
</div>

<script>
let orders = [];
let filter = 'all';
let newIds = new Set();
let soundOn = true;
let notifTimer = null;

const fmt = n => n.toLocaleString('vi-VN') + 'đ';

// ─── Audio ────────────────────────────────────────────────────────────────────
function playBeep() {
  if (!soundOn) return;
  try {
    const ctx = new AudioContext();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
    setTimeout(() => {
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type = 'sine'; o2.frequency.value = 1100;
      g2.gain.setValueAtTime(0, ctx.currentTime);
      g2.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o2.start(); o2.stop(ctx.currentTime + 0.3);
    }, 200);
  } catch(e){}
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔔' : '🔕';
  btn.className = 'sound-btn' + (soundOn ? ' on' : '');
}

// ─── Render ───────────────────────────────────────────────────────────────────
function badgeHTML(s) {
  if (s==='pending') return '<span class="c-badge b-pending">⏳ CHỜ</span>';
  if (s==='processing') return '<span class="c-badge b-processing">⚡ ĐANG LÀM</span>';
  return '<span class="c-badge b-done">✅ XONG</span>';
}

function render() {
  const filtered = filter === 'all' ? orders : orders.filter(o => o.status === filter);
  const grid = document.getElementById('ordersGrid');
  const empty = document.getElementById('emptyState');

  // Stats
  document.getElementById('sPending').textContent = orders.filter(o=>o.status==='pending').length;
  document.getElementById('sProcess').textContent = orders.filter(o=>o.status==='processing').length;
  document.getElementById('sDone').textContent = orders.filter(o=>o.status==='done').length;
  document.getElementById('fc-all').textContent = orders.length || '';
  document.getElementById('fc-pending').textContent = orders.filter(o=>o.status==='pending').length || '';
  document.getElementById('fc-processing').textContent = orders.filter(o=>o.status==='processing').length || '';
  document.getElementById('fc-done').textContent = orders.filter(o=>o.status==='done').length || '';

  if (!filtered.length) {
    grid.innerHTML = ''; empty.style.display = 'block'; return;
  }
  empty.style.display = 'none';

  grid.innerHTML = [...filtered].reverse().map(order => `
    <div class="o-card s-${order.status} ${newIds.has(order.id) ? 'is-new' : ''}">
      <div class="c-head">
        <div>
          <div class="c-machine">📍 ${order.machine}</div>
          <div class="c-time">🕐 ${order.time} &nbsp;·&nbsp; #${String(order.id).slice(-4)}</div>
        </div>
        ${badgeHTML(order.status)}
      </div>
      <div class="c-body">
        ${order.items.map(i => `
          <div class="c-item">
            <span class="ci-em">${i.emoji}</span>
            <span class="ci-n">${i.name}</span>
            <span class="ci-q">×${i.qty}</span>
            <span class="ci-p">${fmt(i.price * i.qty)}</span>
          </div>`).join('')}
        ${order.note ? `<div class="c-note">📝 ${order.note}</div>` : ''}
      </div>
      <div class="c-foot">
        <div class="c-total">${fmt(order.total)}</div>
        <div class="c-acts">
          ${order.status==='pending' ? `<button class="a-btn btn-recv" onclick="setStatus(${order.id},'processing')">⚡ Nhận</button>` : ''}
          ${order.status==='processing' ? `<button class="a-btn btn-done2" onclick="setStatus(${order.id},'done')">✅ Xong</button>` : ''}
          <button class="a-btn btn-del" onclick="delOrder(${order.id})">🗑</button>
        </div>
      </div>
    </div>`).join('');
}

// ─── Actions ──────────────────────────────────────────────────────────────────
async function setStatus(id, status) {
  await window.aknet.updateStatus(id, status);
  const o = orders.find(o => o.id === id);
  if (o) { o.status = status; render(); }
}

async function delOrder(id) {
  await window.aknet.deleteOrder(id);
  orders = orders.filter(o => o.id !== id);
  newIds.delete(id); render();
}

async function clearDoneOrders() {
  await window.aknet.clearDone();
  orders = orders.filter(o => o.status !== 'done');
  render();
}

function confirmClearAll() {
  if (confirm('Xóa toàn bộ đơn hàng hiện tại?')) {
    orders = []; newIds.clear();
    window.aknet.clearDone(); render();
  }
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ─── Notification ─────────────────────────────────────────────────────────────
function showNotif(order) {
  playBeep();
  const body = document.getElementById('notifBody');
  body.innerHTML = `<strong>${order.machine}</strong> – ${order.items.map(i=>`${i.emoji}${i.name}×${i.qty}`).join(', ')}<br><strong style="color:var(--gold)">${fmt(order.total)}</strong>`;
  const n = document.getElementById('notif');
  n.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => n.classList.remove('show'), 7000);
  document.title = '🔔 ORDER MỚI! – AKNet Cashier';
  setTimeout(() => { document.title = 'AKNet Cashier'; }, 5000);
}

function closeNotif() {
  document.getElementById('notif').classList.remove('show');
  clearTimeout(notifTimer);
}

// ─── IPC Events ───────────────────────────────────────────────────────────────
window.aknet.onServerInfo(info => {
  document.getElementById('serverAddr').textContent = `${info.ip}:${info.port}`;
});

window.aknet.onNewOrder(order => {
  if (!orders.find(o => o.id === order.id)) orders.push(order);
  newIds.add(order.id);
  render();
  showNotif(order);
  setTimeout(() => { newIds.delete(order.id); render(); }, 12000);
});

window.aknet.onBroadcast(msg => {
  if (msg.type === 'status_update') {
    const o = orders.find(o => o.id === msg.id);
    if (o) { o.status = msg.status; render(); }
  } else if (msg.type === 'order_deleted') {
    orders = orders.filter(o => o.id !== msg.id);
    render();
  } else if (msg.type === 'refresh') {
    orders = msg.orders || []; render();
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  const info = await window.aknet.getServerInfo();
  document.getElementById('serverAddr').textContent = `${info.ip}:${info.port}`;
  orders = await window.aknet.getOrders();
  render();
})();
</script>
</body>
</html>
