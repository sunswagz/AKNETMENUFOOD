<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AKNet Cashier</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d; --dark:#111; --card:#1a1a1a; --card2:#222;
  --orange:#f5a623; --orange2:#ff8c00; --orange3:rgba(245,166,35,.12);
  --red:#e63030; --green:#22c55e; --cyan:#3b9eff;
  --white:#fff; --text:#d4d4d4; --text2:#666; --muted:#444;
  --border:rgba(245,166,35,.18); --border2:rgba(255,255,255,.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}

/* ══ HEADER ══════════════════════════════════════════════ */
.header{
  height:64px; background:var(--dark);
  border-bottom:2px solid rgba(245,166,35,.25);
  display:flex; align-items:center; padding:0 22px; gap:18px;
  flex-shrink:0; position:relative; z-index:10;
}
.header::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(245,166,35,.4),transparent);}

/* Logo */


/* IP box */


/* Stats */
.hdr-stats{display:flex;gap:2px;margin-left:4px;}
.hdr-stat{padding:6px 18px;text-align:center;border-right:1px solid rgba(255,255,255,.07);}
.hdr-stat:last-child{border-right:none;}
.hdr-stat .sv{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1;}
.hdr-stat .sl{font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;margin-top:1px;}
.stat-wait .sv{color:var(--orange);}
.stat-doing .sv{color:var(--cyan);}
.stat-done .sv{color:var(--green);}

.flex1{flex:1;}

/* Right actions */
.hdr-right{display:flex;align-items:center;gap:10px;}

.notif-btn{width:38px;height:38px;background:var(--orange3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;position:relative;}
.notif-btn:hover{background:rgba(245,166,35,.2);border-color:var(--orange);}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 6px var(--red);}
.hdr-action-btn{background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:8px 16px;color:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;font-family:'Barlow',sans-serif;}
.hdr-action-btn:hover{border-color:rgba(245,166,35,.4);color:var(--orange);}
.hdr-action-btn.danger:hover{border-color:var(--red);color:var(--red);}

/* ══ TABS ════════════════════════════════════════════════ */
.tabs{height:46px;background:var(--dark);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:flex-end;padding:0 22px;gap:0;flex-shrink:0;}
.tab{display:flex;align-items:center;gap:7px;padding:10px 22px 11px;cursor:pointer;border-bottom:3px solid transparent;font-size:13px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.35);transition:all .2s;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
.tab:hover{color:rgba(255,255,255,.7);}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.tab .t-icon{font-size:15px;}

/* ══ ORDERS TAB ════════════════════════════════════════ */
.orders-tab{display:flex;flex-direction:column;flex:1;overflow:hidden;}

/* Filter bar */
.filter-bar{padding:12px 22px;background:var(--dark);border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:8px;align-items:center;flex-shrink:0;}
.f-btn{display:flex;align-items:center;gap:7px;background:transparent;border:1.5px solid rgba(255,255,255,.1);border-radius:22px;padding:6px 16px;color:rgba(255,255,255,.4);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Barlow',sans-serif;letter-spacing:.3px;}
.f-btn:hover{border-color:rgba(245,166,35,.35);color:rgba(245,166,35,.8);}
.f-btn.active{border-color:var(--orange);color:var(--orange);background:var(--orange3);}
.f-btn .fb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.f-btn .fb-count{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;}
.dot-orange{background:var(--orange);}
.dot-cyan{background:var(--cyan);}
.dot-green{background:var(--green);}
.dot-white{background:rgba(255,255,255,.4);}

/* Orders grid */
.orders-area{flex:1;overflow-y:auto;padding:16px 22px 20px;}
.orders-area::-webkit-scrollbar{width:4px;}
.orders-area::-webkit-scrollbar-thumb{background:rgba(245,166,35,.2);border-radius:4px;}
.orders-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* Empty */
.o-empty{text-align:center;padding:80px 20px;color:var(--muted);}
.o-empty .oi{font-size:56px;margin-bottom:14px;opacity:.3;}
.o-empty p{font-size:16px;letter-spacing:3px;font-family:'Bebas Neue',sans-serif;color:rgba(255,255,255,.2);}

/* ── ORDER CARD ── */
.ocard{background:var(--card);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;animation:cardIn .3s cubic-bezier(.4,0,.2,1);position:relative;transition:border-color .2s,box-shadow .2s;}
@keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.ocard:hover{border-color:rgba(245,166,35,.3);box-shadow:0 4px 20px rgba(0,0,0,.4);}
.ocard.s-pending{border-color:rgba(245,166,35,.45);box-shadow:0 0 18px rgba(245,166,35,.08);}
.ocard.s-processing{border-color:rgba(59,158,255,.45);box-shadow:0 0 18px rgba(59,158,255,.08);}
.ocard.s-done{opacity:.5;}
.ocard.is-new::after{content:'MỚI';position:absolute;top:0;right:0;background:var(--red);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:9px;font-weight:700;padding:3px 10px;border-radius:0 14px 0 8px;letter-spacing:2px;animation:newBlink .8s infinite;}
@keyframes newBlink{0%,100%{opacity:1;}50%{opacity:.3;}}
.ocard.is-call{border-color:rgba(245,166,35,.8)!important;box-shadow:0 0 22px rgba(245,166,35,.2)!important;}

/* Card head */
.oc-head{padding:11px 13px 9px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:flex-start;justify-content:space-between;}
.oc-machine-row{display:flex;align-items:center;gap:6px;}
.oc-pin{color:var(--orange);font-size:13px;}
.oc-machine{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:#fff;}
.oc-time{font-size:10px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:4px;}
.oc-time .ti{font-size:11px;}

/* Status badge */
.oc-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;}
.badge-pending{background:rgba(245,166,35,.12);color:var(--orange);border:1px solid rgba(245,166,35,.35);}
.badge-processing{background:rgba(59,158,255,.1);color:var(--cyan);border:1px solid rgba(59,158,255,.35);}
.badge-done{background:rgba(34,197,94,.08);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.badge-call{background:rgba(245,166,35,.15);color:var(--orange);border:1px solid rgba(245,166,35,.5);}

/* Card body */
.oc-body{padding:10px 13px;}
.oc-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
.oc-item:last-child{border-bottom:none;}
.oci-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.oci-name{flex:1;color:var(--text);}
.oci-qty{color:rgba(255,255,255,.4);margin-right:4px;}
.oci-price{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--orange);letter-spacing:.5px;}
.oc-note{margin-top:7px;padding:6px 8px;background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.15);border-radius:7px;font-size:11px;color:rgba(245,166,35,.8);}

/* Card foot */
.oc-foot{padding:9px 13px 11px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;}
.oc-total{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--orange);}
.oc-acts{display:flex;gap:6px;}
.oa-btn{border:none;border-radius:8px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;}
.btn-recv{background:rgba(245,166,35,.15);color:var(--orange);border:1px solid rgba(245,166,35,.4);}
.btn-recv:hover{background:rgba(245,166,35,.28);}
.btn-done2{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-done2:hover{background:rgba(34,197,94,.22);}
.btn-del{background:rgba(230,48,48,.08);color:var(--red);border:1px solid rgba(230,48,48,.2);padding:7px 10px;}
.btn-del:hover{background:rgba(230,48,48,.2);}

/* ══ ADMIN MENU TAB ══════════════════════════════════════ */
.menu-tab{display:none;flex-direction:column;flex:1;overflow:hidden;}
.menu-tab.show{display:flex;}

.menu-toolbar{padding:12px 22px;background:var(--dark);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.add-menu-btn{background:linear-gradient(135deg,var(--orange),var(--orange2));border:none;border-radius:10px;padding:9px 18px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(245,166,35,.3);}
.add-menu-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,166,35,.4);}
.menu-search{flex:1;max-width:280px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px 13px;color:var(--white);font-family:'Barlow',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.menu-search:focus{border-color:rgba(245,166,35,.4);}
.menu-search::placeholder{color:var(--text2);}
.broadcast-btn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.28);border-radius:9px;padding:8px 16px;color:var(--orange);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;font-family:'Barlow',sans-serif;}
.broadcast-btn:hover{background:rgba(245,166,35,.2);}

.menu-grid-area{flex:1;overflow-y:auto;padding:16px 22px;}
.menu-grid-area::-webkit-scrollbar{width:4px;}
.menu-grid-area::-webkit-scrollbar-thumb{background:rgba(245,166,35,.2);border-radius:4px;}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}

/* Admin card */
.acard{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;transition:all .2s;position:relative;}
.acard:hover{border-color:rgba(245,166,35,.3);box-shadow:0 6px 20px rgba(0,0,0,.4);}
.acard.hidden-item{opacity:.4;}
.acard-img{height:110px;background:linear-gradient(135deg,#161616,#202020);display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;overflow:hidden;cursor:pointer;}
.acard-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.acard-img:hover img{transform:scale(1.05);}
.acard-img .upoverlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;}
.acard-img:hover .upoverlay{display:flex;}
.acard-img .upoverlay .upi{font-size:22px;}
.acard-body{padding:9px 11px 11px;}
.acard-name{font-size:12px;font-weight:700;color:var(--white);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:2px;}
.acard-cat{font-size:9px;letter-spacing:2px;color:var(--orange);margin-bottom:5px;text-transform:uppercase;}
.acard-price{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--orange);margin-bottom:7px;}
.acard-acts{display:flex;gap:5px;}
.acard-btn{flex:1;border:none;border-radius:7px;padding:5px;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Barlow',sans-serif;letter-spacing:.3px;}
.ab-edit{background:rgba(59,158,255,.1);color:var(--cyan);border:1px solid rgba(59,158,255,.25);}
.ab-edit:hover{background:rgba(59,158,255,.22);}
.ab-hide{background:rgba(245,166,35,.08);color:var(--orange);border:1px solid rgba(245,166,35,.22);}
.ab-hide:hover{background:rgba(245,166,35,.18);}
.ab-del{background:rgba(230,48,48,.07);color:var(--red);border:1px solid rgba(230,48,48,.18);}
.ab-del:hover{background:rgba(230,48,48,.18);}

/* ══ MODAL ═══════════════════════════════════════════════ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.modal-bg.show{display:flex;}
@keyframes popIn{from{opacity:0;transform:scale(.87);}to{opacity:1;transform:none;}}
.modal{background:var(--dark);border:2px solid rgba(245,166,35,.35);border-radius:18px;padding:28px 32px;width:480px;max-height:90vh;overflow-y:auto;animation:popIn .28s cubic-bezier(.4,0,.2,1);position:relative;}
.modal::-webkit-scrollbar{width:3px;}
.modal::-webkit-scrollbar-thumb{background:rgba(245,166,35,.2);}
.modal::before{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:var(--orange);margin-bottom:22px;}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;transition:all .2s;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.mf{margin-bottom:14px;}
.mf label{display:block;font-size:9px;font-weight:800;letter-spacing:2.5px;color:rgba(245,166,35,.6);margin-bottom:6px;text-transform:uppercase;}
.mf input,.mf select,.mf textarea{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:9px;color:var(--white);padding:10px 13px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.mf input:focus,.mf select:focus{border-color:rgba(245,166,35,.4);}
.mf select option{background:var(--dark);}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mf-check{display:flex;align-items:center;gap:8px;cursor:pointer;}
.mf-check input[type=checkbox]{width:16px;height:16px;accent-color:var(--orange);}
.mf-check span{font-size:13px;color:var(--text);}

/* Image upload area */
.img-area{border:2px dashed rgba(255,255,255,.1);border-radius:12px;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;margin-bottom:14px;}
.img-area:hover{border-color:rgba(245,166,35,.4);background:var(--orange3);}
.img-area.has-img{border-style:solid;border-color:rgba(245,166,35,.4);padding:0;}
.img-area img{width:100%;height:150px;object-fit:cover;border-radius:10px;}
.img-area .ia-hint{font-size:11px;color:var(--text2);}
.img-area .ia-icon{font-size:28px;}
.img-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

.modal-btns{display:flex;gap:10px;margin-top:6px;}
.modal-save{flex:1;background:linear-gradient(135deg,var(--orange),var(--orange2));border:none;border-radius:11px;padding:13px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 14px rgba(245,166,35,.3);transition:all .2s;}
.modal-save:hover{transform:translateY(-1px);}
.modal-cancel{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:13px 18px;color:rgba(255,255,255,.4);font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.modal-cancel:hover{border-color:var(--red);color:var(--red);}

/* NOTIFICATION */
.notif-popup{display:none;position:fixed;top:74px;right:18px;width:300px;background:var(--dark);border:2px solid var(--red);border-radius:13px;padding:13px 16px;box-shadow:0 8px 36px rgba(230,48,48,.35);z-index:999;animation:popIn .28s cubic-bezier(.4,0,.2,1);}
.notif-popup.show{display:block;}
.notif-title{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--red);margin-bottom:5px;letter-spacing:1px;}
.notif-body{font-size:12px;color:var(--text);line-height:1.5;}
.notif-close{position:absolute;top:9px;right:11px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;}

/* SOUND BTN */
.sound-btn{width:38px;height:38px;background:var(--orange3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;}
.sound-btn:hover{background:rgba(245,166,35,.2);}

/* ══ PREMIUM TITLE BAR - CASHIER ════════════════════════ */
.titlebar {
  height: 52px;
  background: linear-gradient(90deg, #0a0800 0%, #111008 30%, #0d0d0d 60%, #0a0800 100%);
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, transparent 0%, #f5a623 20%, #ffd700 50%, #f5a623 80%, transparent 100%) 1;
  display: flex;
  align-items: center;
  padding: 0;
  flex-shrink: 0;
  position: relative;
  z-index: 9999;
  -webkit-app-region: drag;
  user-select: none;
  overflow: hidden;
}
.titlebar::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg,
    transparent 0%, rgba(245,166,35,.1) 10%,
    rgba(255,200,50,.8) 35%, rgba(255,230,100,1) 50%,
    rgba(255,200,50,.8) 65%, rgba(245,166,35,.1) 90%,
    transparent 100%
  );
  box-shadow: 0 0 12px rgba(255,220,80,.6), 0 0 30px rgba(245,166,35,.3);
}
.titlebar::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 15% 50%, rgba(245,166,35,.06) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 50%, rgba(245,166,35,.02) 0%, transparent 60%);
  pointer-events: none;
}
.tb-logo-section {
  display: flex; align-items: center; gap: 0;
  padding: 0 6px 0 10px; height: 100%;
  -webkit-app-region: drag; position: relative; z-index: 2;
}
.tb-hex-frame {
  width: 42px; height: 42px; position: relative;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tb-hex-border {
  position: absolute; inset: 0;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: linear-gradient(135deg, #f5a623, #ffd700, #f5a623);
  z-index: 0; padding: 1.5px;
}
.tb-hex-inner {
  position: absolute; inset: 1.5px;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: linear-gradient(135deg, #1c1400, #2a1e00);
  z-index: 1; display: flex; align-items: center; justify-content: center;
}
.tb-hex-inner img {
  width: 26px; height: 26px; object-fit: contain;
  filter: drop-shadow(0 0 4px rgba(245,166,35,.6));
  position: relative; z-index: 2;
}
.tb-hex-corner {
  position: absolute; width: 4px; height: 4px;
  background: #f5a623; border-radius: 50%;
  box-shadow: 0 0 6px rgba(245,166,35,.8); z-index: 3;
}
.tb-hex-corner.tl { top: 4px; left: 50%; transform: translateX(-50%); }
.tb-hex-corner.br { bottom: 4px; left: 50%; transform: translateX(-50%); }
.tb-brand-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 5px; color: #f5a623;
  text-shadow: 0 0 14px rgba(245,166,35,.5), 0 0 28px rgba(245,166,35,.2);
  margin-left: 10px; padding-right: 6px; -webkit-app-region: drag;
}
.tb-divider {
  width: 1px; height: 28px;
  background: linear-gradient(to bottom, transparent, rgba(245,166,35,.5), transparent);
  margin: 0 4px; flex-shrink: 0;
}
.tb-title-badge {
  margin-left: 4px; padding: 5px 16px;
  background: linear-gradient(135deg, rgba(245,166,35,.08), rgba(245,166,35,.04));
  border: 1px solid rgba(245,166,35,.3); border-radius: 4px;
  position: relative; -webkit-app-region: drag;
}
.tb-title-badge::before, .tb-title-badge::after {
  content: ''; position: absolute;
  width: 6px; height: 6px; border-color: rgba(245,166,35,.6); border-style: solid;
}
.tb-title-badge::before { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; }
.tb-title-badge::after { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; }
.tb-title-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: 4px;
  color: #f5a623; text-transform: uppercase;
  text-shadow: 0 0 10px rgba(245,166,35,.4);
}
.tb-spacer { flex: 1; -webkit-app-region: drag; }
.tb-deco {
  position: absolute; right: 120px; top: 0; bottom: 0; width: 200px;
  opacity: .07; pointer-events: none; -webkit-app-region: drag;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
}
.tb-deco svg { width: 160px; height: 44px; fill: rgba(245,166,35,.6); }
.tb-server-info {
  display: flex; align-items: center; gap: 6px;
  margin-right: 10px; -webkit-app-region: no-drag; flex-shrink: 0;
}
.tb-server-box {
  background: rgba(245,166,35,.1);
  border: 1.5px solid rgba(245,166,35,.4);
  border-radius: 8px;
  padding: 5px 14px;
  box-shadow: 0 0 12px rgba(245,166,35,.1);
}
.tb-server-label { font-size: 8px; letter-spacing: 2.5px; color: rgba(245,166,35,.55); text-transform: uppercase; margin-bottom: 2px; }
.tb-server-val { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: #ffc845; text-shadow: 0 0 10px rgba(245,166,35,.4); }
.tb-live-pill {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  color: #22c55e; text-transform: uppercase;
  -webkit-app-region: no-drag;
}
.tb-live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e; box-shadow: 0 0 7px #22c55e;
  animation: livePulse2 1.5s infinite;
}
@keyframes livePulse2 { 0%,100%{opacity:1;} 50%{opacity:.4;} }
.tb-controls {
  display: flex; align-items: center; height: 100%;
  -webkit-app-region: no-drag; margin-left: 8px;
}
.tb-ctrl {
  width: 46px; height: 100%; border: none; background: transparent;
  color: rgba(255,255,255,.3); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s; position: relative;
}
.tb-ctrl:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.8); }
.tb-ctrl.tc-close:hover { background: rgba(230,48,48,.75); color: #fff; }
.tb-ctrl.tc-max:hover { background: rgba(34,197,94,.18); color: #22c55e; }
.tb-ctrl.tc-min:hover { background: rgba(245,166,35,.15); color: #f5a623; }

/* Layout fix */
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
</style>
</head>

        <circle cx="100" cy="25" r="4" fill="currentColor" opacity=".6"/>
        <circle cx="100" cy="25" r="8" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".5"/>

        <ellipse cx="55" cy="25" rx="12" ry="15" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".5" transform="rotate(60 55 25)"/>
        <ellipse cx="55" cy="25" rx="12" ry="15" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".5" transform="rotate(120 55 25)"/>
        <circle cx="55" cy="25" r="3" fill="currentColor" opacity=".4"/>
        <ellipse cx="155" cy="25" rx="12" ry="15" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".5"/>
        <ellipse cx="155" cy="25" rx="12" ry="15" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".5" transform="rotate(60 155 25)"/>
        <ellipse cx="155" cy="25" rx="12" ry="15" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".5" transform="rotate(120 155 25)"/>
        <circle cx="155" cy="25" r="3" fill="currentColor" opacity=".4"/>
        <line x1="30" y1="25" x2="175" y2="25" stroke="currentColor" stroke-width="0.4" opacity=".3"/>
      </g>
    </svg>
  </div>

  <!-- Server IP hiển thị trên title bar -->
  <div class="tb-server-info">
    <div class="tb-server-box">
      <div class="tb-server-label">IP MÁY TRẠM</div>
      <div class="tb-server-val" id="tbServerAddr">...</div>
    </div>
    <div class="tb-live-pill"><div class="tb-live-dot"></div>LIVE</div>
  </div>

  <div class="tb-controls">
    <button class="tb-ctrl tc-min" onclick="if(window.aknet)window.aknet.minimize()" title="Thu nhỏ">
      <svg width="10" height="1" viewBox="0 0 10 1"><line x1="0" y1="0.5" x2="10" y2="0.5" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="tb-ctrl tc-max" onclick="if(window.aknet)window.aknet.maximize()" title="Phóng to">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="tb-ctrl tc-close" onclick="if(window.aknet)window.aknet.close()" title="Đóng">
      <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.4"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="hdr-stats">
    <div class="hdr-stat stat-wait">
      <div class="sv" id="sPending">0</div>
      <div class="sl">CHỜ</div>
    </div>
    <div class="hdr-stat stat-doing">
      <div class="sv" id="sProcess">0</div>
      <div class="sl">ĐANG LÀM</div>
    </div>
    <div class="hdr-stat stat-done">
      <div class="sv" id="sDone">0</div>
      <div class="sl">XONG</div>
    </div>
  </div>

  <div class="flex1"></div>

  <div class="hdr-right">
    <div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔔</div>
    <button class="hdr-action-btn" onclick="clearDone()">Xóa đã xong</button>
    <button class="hdr-action-btn danger" onclick="confirmClearAll()">Xóa tất cả</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" id="tab-orders" onclick="switchTab('orders')">
    <span class="t-icon">📋</span> QUẢN LÝ ORDER
  </div>
  <div class="tab" id="tab-menu" onclick="switchTab('menu')">
    <span class="t-icon">🍽</span> QUẢN LÝ MENU
  </div>
</div>

<!-- ORDERS TAB -->
<div class="orders-tab" id="ordersTab">
  <div class="filter-bar">
    <button class="f-btn active" onclick="setFilter('all',this)">
      <span style="font-size:13px">📋</span> Tất cả <span class="fb-count" id="fc-all">0</span>
    </button>
    <button class="f-btn" onclick="setFilter('pending',this)">
      <span class="fb-dot dot-orange"></span> Chờ <span class="fb-count" id="fc-pending">0</span>
    </button>
    <button class="f-btn" onclick="setFilter('processing',this)">
      <span class="fb-dot dot-cyan"></span> Đang làm <span class="fb-count" id="fc-processing">0</span>
    </button>
    <button class="f-btn" onclick="setFilter('done',this)">
      <span>✅</span> Xong <span class="fb-count" id="fc-done">0</span>
    </button>
  </div>
  <div class="orders-area">
    <div class="orders-grid" id="ordersGrid"></div>
    <div class="o-empty" id="emptyState" style="display:none">
      <div class="oi">📡</div>
      <p>ĐANG CHỜ ĐƠN MỚI</p>
    </div>
  </div>
</div>

<!-- MENU TAB -->
<div class="menu-tab" id="menuTab">
  <div class="menu-toolbar">
    <button class="add-menu-btn" onclick="openModal()">+ THÊM MÓN MỚI</button>
    <input class="menu-search" type="text" id="menuSearch" placeholder="🔍 Tìm món..." oninput="renderAdminGrid()"/>
    <button class="broadcast-btn" onclick="broadcastMenu()">📡 CẬP NHẬT MÁY TRẠM</button>
  </div>
  <div class="menu-grid-area">
    <div class="admin-grid" id="adminGrid"></div>
  </div>
</div>

<!-- NOTIFICATION POPUP -->
<div class="notif-popup" id="notifPopup">
  <button class="notif-close" onclick="closeNotif()">✕</button>
  <div class="notif-title" id="notifTitle">🔔 ORDER MỚI!</div>
  <div class="notif-body" id="notifBody"></div>
</div>

<!-- MODAL THÊM/SỬA MÓN -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">➕ THÊM MÓN MỚI</div>

    <div class="mf">
      <label>Ảnh Món Ăn</label>
      <div class="img-area" id="imgArea" onclick="triggerImgUpload()">
        <img id="previewImg" src="" style="display:none"/>
        <div id="uploadHint">
          <div class="ia-icon">📷</div>
          <div class="ia-hint">Click để upload ảnh (JPG/PNG, tối đa 2MB)</div>
        </div>
        <input type="file" id="imgFileInput" accept="image/*" onchange="handleImg(event)" style="display:none"/>
      </div>
    </div>

    <div class="mf-row">
      <div class="mf"><label>Tên Món *</label><input id="f-name" placeholder="VD: Mì Xào Bò"/></div>
      <div class="mf"><label>Danh Mục *</label>
        <select id="f-cat">
          <option value="Best Seller">Best Seller</option>
          <option value="Đồ Ăn">Đồ Ăn</option>
          <option value="Mì & Phở">Mì & Phở</option>
          <option value="Gà Rán">Gà Rán</option>
          <option value="Đồ Ăn Vặt">Đồ Ăn Vặt</option>
          <option value="Nước Uống">Nước Uống</option>
          <option value="Tráng Miệng">Tráng Miệng</option>
          <option value="Giờ Chơi">Giờ Chơi</option>
        </select>
      </div>
    </div>
    <div class="mf-row">
      <div class="mf"><label>Giá Bán (VND) *</label><input id="f-price" type="number" placeholder="25000"/></div>
      <div class="mf"><label>Giá Gốc (để trống nếu không KM)</label><input id="f-oldprice" type="number" placeholder="30000"/></div>
    </div>
    <div class="mf-row">
      <div class="mf"><label>Emoji (nếu không có ảnh)</label><input id="f-emoji" placeholder="🍜"/></div>
      <div class="mf" style="display:flex;align-items:flex-end;padding-bottom:3px;">
        <label class="mf-check"><input type="checkbox" id="f-best"/><span>⭐ Best Seller</span></label>
      </div>
    </div>
    <div class="mf"><label>Mô Tả Ngắn</label><input id="f-desc" placeholder="VD: Mì xào bò sốt tiêu đen thơm ngon"/></div>

    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">HỦY</button>
      <button class="modal-save" onclick="saveItem()">💾 LƯU MÓN</button>
    </div>
  </div>
</div>

<script>
// ══ STATE ═════════════════════════════════════════════════
let orders=[], MENU=[], filter='all', newIds=new Set(), soundOn=true;
let editingId=null, currentImg=null, notifTimer=null;
const fmt=n=>n.toLocaleString('vi-VN')+'đ';

// ══ TABS ══════════════════════════════════════════════════
function switchTab(t){
  document.getElementById('ordersTab').style.display=t==='orders'?'flex':'none';
  document.getElementById('menuTab').classList.toggle('show',t==='menu');
  document.getElementById('tab-orders').classList.toggle('active',t==='orders');
  document.getElementById('tab-menu').classList.toggle('active',t==='menu');
  if(t==='menu') renderAdminGrid();
}
document.getElementById('ordersTab').style.display='flex';

// ══ ORDERS ════════════════════════════════════════════════
function badgeHTML(s,isCall){
  if(isCall) return '<span class="oc-badge badge-call">🔔 GỌI NHÂN VIÊN</span>';
  if(s==='pending') return '<span class="oc-badge badge-pending">✖ CHỜ</span>';
  if(s==='processing') return '<span class="oc-badge badge-processing">⚡ ĐANG LÀM</span>';
  return '<span class="oc-badge badge-done">✅ XONG</span>';
}

function renderOrders(){
  const filtered=filter==='all'?orders:orders.filter(o=>o.status===filter);
  const grid=document.getElementById('ordersGrid');
  const empty=document.getElementById('emptyState');

  // Update stats
  const pending=orders.filter(o=>o.status==='pending').length;
  const processing=orders.filter(o=>o.status==='processing').length;
  const done=orders.filter(o=>o.status==='done').length;
  document.getElementById('sPending').textContent=pending;
  document.getElementById('sProcess').textContent=processing;
  document.getElementById('sDone').textContent=done;
  document.getElementById('fc-all').textContent=orders.length;
  document.getElementById('fc-pending').textContent=pending;
  document.getElementById('fc-processing').textContent=processing;
  document.getElementById('fc-done').textContent=done;

  if(!filtered.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  grid.innerHTML=[...filtered].reverse().map(order=>{
    const isCall=order.type==='call_staff';
    const items=(order.items||[]).map(i=>`
      <div class="oc-item">
        <span class="oci-icon">${i.emoji||'🍽'}</span>
        <span class="oci-name">${i.name}</span>
        <span class="oci-qty">x${i.qty}</span>
        <span class="oci-price">${fmt(i.price*i.qty)}</span>
      </div>`).join('');
    return `
      <div class="ocard s-${order.status||'pending'} ${newIds.has(order.id)?'is-new':''} ${isCall?'is-call':''}">
        <div class="oc-head">
          <div>
            <div class="oc-machine-row">
              <span class="oc-pin">📍</span>
              <span class="oc-machine">${order.machine}</span>
            </div>
            <div class="oc-time"><span class="ti">🕐</span>${order.time} · #${String(order.id).slice(-4)}</div>
          </div>
          ${badgeHTML(order.status,isCall)}
        </div>
        <div class="oc-body">
          ${items}
          ${order.note?`<div class="oc-note">📝 ${order.note}</div>`:''}
        </div>
        <div class="oc-foot">
          <div class="oc-total">${fmt(order.total||0)}</div>
          <div class="oc-acts">
            ${!isCall&&order.status==='pending'?`<button class="oa-btn btn-recv" onclick="setStatus(${order.id},'processing')">⚡ Nhận</button>`:''}
            ${!isCall&&order.status==='processing'?`<button class="oa-btn btn-done2" onclick="setStatus(${order.id},'done')">✅ Xong</button>`:''}
            <button class="oa-btn btn-del" onclick="delOrder(${order.id})">🗑</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function setStatus(id,status){
  if(window.aknet) await window.aknet.updateStatus(id,status);
  const o=orders.find(o=>o.id===id);if(o){o.status=status;renderOrders();}
}
async function delOrder(id){
  if(window.aknet) await window.aknet.deleteOrder(id);
  orders=orders.filter(o=>o.id!==id);newIds.delete(id);renderOrders();
}
async function clearDone(){
  if(window.aknet) await window.aknet.clearDone();
  orders=orders.filter(o=>o.status!=='done');renderOrders();
}
function confirmClearAll(){if(confirm('Xóa toàn bộ đơn?')){orders=[];newIds.clear();renderOrders();}}
function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderOrders();
}

// ══ NOTIFICATION ══════════════════════════════════════════
function showNotif(title,body){
  playBeep();
  document.getElementById('notifTitle').textContent=title;
  document.getElementById('notifBody').innerHTML=body;
  const n=document.getElementById('notifPopup');
  n.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>n.classList.remove('show'),7000);
  document.title='🔔 '+title;
  setTimeout(()=>document.title='AKNet Cashier',5000);
}
function closeNotif(){document.getElementById('notifPopup').classList.remove('show');}

function playBeep(){
  if(!soundOn) return;
  try{
    const ctx=new AudioContext(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=900;
    g.gain.setValueAtTime(0,ctx.currentTime);
    g.gain.linearRampToValueAtTime(.3,ctx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);
    o.start();o.stop(ctx.currentTime+.4);
    setTimeout(()=>{
      const o2=ctx.createOscillator(),g2=ctx.createGain();
      o2.connect(g2);g2.connect(ctx.destination);
      o2.type='sine';o2.frequency.value=1200;
      g2.gain.setValueAtTime(0,ctx.currentTime);
      g2.gain.linearRampToValueAtTime(.25,ctx.currentTime+.01);
      g2.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);
      o2.start();o2.stop(ctx.currentTime+.3);
    },220);
  }catch(e){}
}
function toggleSound(){
  soundOn=!soundOn;
  const b=document.getElementById('soundBtn');
  b.textContent=soundOn?'🔔':'🔕';
}

// ══ ADMIN MENU ════════════════════════════════════════════
function loadMenu(){
  if(window.aknet) window.aknet.getMenu().then(m=>{if(m&&m.length){MENU=m;renderAdminGrid();}}).catch(()=>{});
}
function saveMenu(){if(window.aknet) window.aknet.saveMenu(MENU).catch(()=>{});}
function broadcastMenu(){
  if(window.aknet) window.aknet.broadcastMenu(MENU.filter(i=>!i.hidden));
  showNotif('📡 CẬP NHẬT!','Menu mới đã gửi đến tất cả máy trạm.');
}

function renderAdminGrid(){
  const q=(document.getElementById('menuSearch')?.value||'').toLowerCase();
  const filtered=MENU.filter(i=>!q||i.name.toLowerCase().includes(q));
  const grid=document.getElementById('adminGrid');
  if(!filtered.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2);font-size:14px;letter-spacing:2px;">CHƯA CÓ MÓN NÀO — BẤM + THÊM MÓN MỚI</div>';return;}
  grid.innerHTML=filtered.map(item=>`
    <div class="acard ${item.hidden?'hidden-item':''}">
      <div class="acard-img" onclick="openModal(${item.id})">
        ${item.image?`<img src="${item.image}" alt="">`:item.emoji||'🍽'}
        <div class="upoverlay"><div class="upi">📷</div><span>ĐỔI ẢNH</span></div>
      </div>
      <div class="acard-body">
        <div class="acard-name">${item.best?'👑 ':''}${item.name}</div>
        <div class="acard-cat">${item.cat}</div>
        <div class="acard-price">${fmt(item.price)} ${item.oldPrice?`<span style="font-size:10px;color:var(--text2);text-decoration:line-through">${fmt(item.oldPrice)}</span>`:''}</div>
        <div class="acard-acts">
          <button class="acard-btn ab-edit" onclick="openModal(${item.id})">✏ Sửa</button>
          <button class="acard-btn ab-hide" onclick="toggleHide(${item.id})">${item.hidden?'👁 Hiện':'🚫 Ẩn'}</button>
          <button class="acard-btn ab-del" onclick="delItem(${item.id})">🗑</button>
        </div>
      </div>
    </div>`).join('');
}

function toggleHide(id){const i=MENU.find(i=>i.id===id);if(i){i.hidden=!i.hidden;saveMenu();renderAdminGrid();}}
function delItem(id){if(!confirm('Xóa món này?')) return;MENU=MENU.filter(i=>i.id!==id);saveMenu();renderAdminGrid();}

// ══ MODAL ═════════════════════════════════════════════════
function openModal(id=null){
  editingId=id;currentImg=null;
  const item=id?MENU.find(i=>i.id===id):null;
  document.getElementById('modalTitle').textContent=id?'✏ CHỈNH SỬA MÓN':'➕ THÊM MÓN MỚI';
  document.getElementById('f-name').value=item?.name||'';
  document.getElementById('f-cat').value=item?.cat||'Đồ Ăn';
  document.getElementById('f-price').value=item?.price||'';
  document.getElementById('f-oldprice').value=item?.oldPrice||'';
  document.getElementById('f-emoji').value=item?.emoji||'';
  document.getElementById('f-desc').value=item?.desc||'';
  document.getElementById('f-best').checked=item?.best||false;
  const prev=document.getElementById('previewImg');
  const hint=document.getElementById('uploadHint');
  const area=document.getElementById('imgArea');
  if(item?.image){
    prev.src=item.image;prev.style.display='block';hint.style.display='none';
    area.classList.add('has-img');currentImg=item.image;
  } else {
    prev.src='';prev.style.display='none';hint.style.display='flex';area.classList.remove('has-img');
  }
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');editingId=null;currentImg=null;}
function triggerImgUpload(){document.getElementById('imgFileInput').click();}
function handleImg(e){
  const file=e.target.files[0];if(!file) return;
  if(file.size>2*1024*1024){alert('Ảnh quá lớn! Tối đa 2MB');return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    currentImg=ev.target.result;
    document.getElementById('previewImg').src=currentImg;
    document.getElementById('previewImg').style.display='block';
    document.getElementById('uploadHint').style.display='none';
    document.getElementById('imgArea').classList.add('has-img');
  };
  reader.readAsDataURL(file);
}
function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  const price=parseInt(document.getElementById('f-price').value);
  if(!name){alert('Vui lòng nhập tên món!');return;}
  if(!price||price<=0){alert('Vui lòng nhập giá hợp lệ!');return;}
  const item={
    id:editingId||Date.now(),
    name,price,
    oldPrice:parseInt(document.getElementById('f-oldprice').value)||null,
    cat:document.getElementById('f-cat').value,
    emoji:document.getElementById('f-emoji').value||'🍽',
    desc:document.getElementById('f-desc').value,
    best:document.getElementById('f-best').checked,
    image:currentImg||null,hidden:false,
  };
  if(editingId){const idx=MENU.findIndex(i=>i.id===editingId);if(idx>=0)MENU[idx]=item;}
  else MENU.push(item);
  saveMenu();renderAdminGrid();closeModal();
}

// ══ IPC ═══════════════════════════════════════════════════
if(window.aknet){
  window.aknet.onServerInfo(info=>{
    const tbAddr=document.getElementById('tbServerAddr');if(tbAddr)tbAddr.textContent=`${info.ip}:${info.port}`;
  });
  window.aknet.onNewOrder(order=>{
    if(!orders.find(o=>o.id===order.id)) orders.push(order);
    newIds.add(order.id);
    renderOrders();
    const isCall=order.type==='call_staff';
    showNotif(
      isCall?'🔔 GỌI NHÂN VIÊN!':'🔔 ORDER MỚI!',
      isCall
        ?`<strong>${order.machine}</strong> cần nhân viên hỗ trợ!`
        :`<strong>${order.machine}</strong> – ${(order.items||[]).map(i=>`${i.emoji||''}${i.name}×${i.qty}`).join(', ')}<br><strong style="color:var(--orange)">${fmt(order.total||0)}</strong>`
    );
    if(!document.hasFocus()){
      try{window.electronAPI?.flashFrame();}catch(e){}
    }
    setTimeout(()=>{newIds.delete(order.id);renderOrders();},12000);
  });
  window.aknet.onBroadcast(msg=>{
    if(msg.type==='status_update'){const o=orders.find(o=>o.id===msg.id);if(o){o.status=msg.status;renderOrders();}}
    else if(msg.type==='order_deleted'){orders=orders.filter(o=>o.id!==msg.id);renderOrders();}
    else if(msg.type==='refresh'){orders=msg.orders||[];renderOrders();}
  });
}

// ══ INIT ══════════════════════════════════════════════════
(async()=>{
  if(window.aknet){
    const info=await window.aknet.getServerInfo();
    const tbAddr=document.getElementById('tbServerAddr');if(tbAddr)tbAddr.textContent=`${info.ip}:${info.port}`;
    orders=await window.aknet.getOrders();
    loadMenu();
  }
  renderOrders();
})();
</script>
</body>
</html>
